[project]
name = "bank-common"
version = "0.1.0"
description = "Shared models and utilities for WeCode Bank"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "PyJWT>=2.8",
  "passlib[bcrypt]>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bank_common*"]
