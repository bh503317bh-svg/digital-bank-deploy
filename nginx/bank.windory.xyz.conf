# WeCode Bank Demo — reverse proxy via miru-nginx
# Install: copy to /opt/miru/runtime/nginx/conf.d/ and reload miru-nginx
# Also: docker network connect miru_net bank-nginx

server {
    listen 80;
    server_name bank.windory.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bank.windory.xyz;

    ssl_certificate     /etc/nginx/certs/windory.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/windory.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        proxy_pass http://bank-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
    }
}
